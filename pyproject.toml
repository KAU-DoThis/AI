[project]
name = "fintris-ai-server-starter"
version = "0.1.0"
description = "Minimal Spring-to-Fintris AI server integration prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.10,<4",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24", "httpx>=0.27,<1"]

[tool.setuptools.package-data]
"app.modules.classifier" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
